[platformio]
default_envs = dev

; ---- shared settings ----
[env]
platform = espressif32@^6.9.0                 ; pinned major = reproducible builds
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L                ; 80 MHz flash (default is 40)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs              ; data/ folder -> pio run -t uploadfs

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Match the S3's USB ID, not a COM number, so it survives port changes and ignores the CyberPi on the hub.
upload_port  = hwgrep://303A:1001
monitor_port = hwgrep://303A:1001
upload_speed = 921600                          ; only matters on UART bridges; native USB ignores it
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize

; ---- everyday: verbose logs ----
[env:dev]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=4

; ---- release: logs off, smaller/faster ----
[env:release]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=0 -Os