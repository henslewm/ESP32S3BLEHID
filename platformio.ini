; PlatformIO build for this project. Rules: docs/PLATFORMIO.md. The user's original is archive/platformio.user-original-2026-09-27.ini.
; Board verified 2026-09-27 with esptool: ESP32-S3 (QFN56) rev v0.2, 16 MB flash, embedded 8 MB octal PSRAM (N16R8).
[platformio]
default_envs = dev
src_dir = firmware/BLEScanner_WORKING_v7        ; Arduino sketch folder: .ino + module .cpp/.h (MODULES.md)

; ---- shared settings ----
[env]
; Pinned to Arduino-ESP32 3.3.12 (charter). Stock espressif32@6.x ships core 2.0.x, which has no built-in
; NimBLE and fails this sketch's CONFIG_NIMBLE_ENABLED check. pioarduino tag 55.03.312-1 = Arduino v3.3.12 / ESP-IDF v5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/pio_build_id.py     ; FIRMWARE_BUILD_ID = <git sha>[-dirty]-pio-<env>

board_build.arduino.memory_type = qio_opi         ; QIO flash + octal PSRAM (N16R8)
board_build.flash_mode = qio
board_build.f_flash = 80000000L                   ; 80 MHz flash (default is 40)
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600                ; app0 slot of default_16MB.csv (0x640000), not physical flash
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs                 ; data/ folder -> pio run -t uploadfs

; Arduino-ESP32 3.x already builds with -std=gnu++2b, so the gnu++11 -> gnu++17 override is dropped.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1                   ; Serial on the native USB port (same as CDCOnBoot=cdc)

; Match the S3's USB ID, not a COM number, so it survives port changes and ignores the CyberPi on the hub.
upload_port  = hwgrep://303A:1001
monitor_port = hwgrep://303A:1001
upload_speed = 921600                             ; only matters on UART bridges; native USB ignores it
monitor_speed = 921600                            ; matches SERIAL_BAUD in config.h
monitor_filters = esp32_exception_decoder, time, colorize

; ---- everyday: errors only. The charter requires a quiet boot; level 4 floods Serial with BLE core logs ----
[env:dev]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=1

; ---- troubleshooting: verbose core logs (not quiet; do not use for acceptance runs) ----
[env:debug]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=4

; ---- release: logs off ----
[env:release]
build_flags = ${env.build_flags} -DCORE_DEBUG_LEVEL=0
