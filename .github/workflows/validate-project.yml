name: Validate AI project repository

on:
  push:
    paths-ignore:
      - '.autonomy/ledger.json'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_project.py
      - name: Run tests
        run: |
          python -m pip install -r requirements-work-packets.txt
          python -m unittest discover -s tests -p "test_*.py"
      - name: Validate project foundation
        run: python scripts/validate_bootstrap_ci.py --event-name "${{ github.event_name }}" --ref "${{ github.ref }}" --path config/bootstrap.json
